<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4-Channel Dashboard TEST</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #000; overflow: hidden; }
  body { font-family: Arial, sans-serif; }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    height: 100vh;
    width: 100vw;
    gap: 2px;
    background: #000;
  }
  .cell { position: relative; background: #000; border: 3px solid transparent; outline: none; }
  .cell.selected { border-color: #ffd400; }
  iframe { width: 100%; height: 100%; border: 0; pointer-events: none; }
  .label {
    position: absolute; top: 8px; left: 8px; z-index: 5;
    background: rgba(0,0,0,0.7); color: #fff;
    font-size: 14px; padding: 4px 10px; border-radius: 3px;
  }
  .hint {
    position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
    z-index: 20; background: rgba(0,0,0,0.75); color: #fff;
    font-size: 12px; padding: 4px 12px; border-radius: 3px; pointer-events: none;
  }
  #overlay {
    display: none;
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 30;
    background: rgba(0,0,0,0.55);
  }
  #overlay.open { display: flex; align-items: center; justify-content: center; }
  #picker {
    background: #111; color: #fff; border: 2px solid #333; border-radius: 6px;
    width: 320px; max-height: 80vh; overflow: hidden; padding: 8px 0;
  }
  #picker-title {
    font-size: 14px; color: #ffd400; padding: 6px 14px;
    border-bottom: 1px solid #333; margin-bottom: 4px;
  }
  .opt {
    padding: 8px 14px; font-size: 15px; cursor: pointer;
  }
  .opt.active { background: #ffd400; color: #000; }
  .opt.cur::after { content: "  \2713"; }
</style>
</head>
<body>
  <div class="grid">
    <div class="cell selected" tabindex="0"><div class="label">Geo News</div><iframe allow="autoplay; encrypted-media" src="https://www.youtube.com/embed/t3fvgmDDmdc?autoplay=1&mute=1&controls=1&rel=0"></iframe></div>
    <div class="cell" tabindex="0"><div class="label">92 News HD</div><iframe allow="autoplay; encrypted-media" src="https://www.youtube.com/embed/PfO2i8XReZA?autoplay=1&mute=1&controls=1&rel=0"></iframe></div>
    <div class="cell" tabindex="0"><div class="label">Dunya News</div><iframe allow="autoplay; encrypted-media" src="https://www.youtube.com/embed/e2XVSUYh4S0?autoplay=1&mute=1&controls=1&rel=0"></iframe></div>
    <div class="cell" tabindex="0"><div class="label">ARY News</div><iframe allow="autoplay; encrypted-media" src="https://www.youtube.com/embed/5FW9ZVMR_7M?autoplay=1&mute=1&controls=1&rel=0"></iframe></div>
  </div>

  <div id="overlay">
    <div id="picker">
      <div id="picker-title"></div>
      <div id="opts"></div>
    </div>
  </div>

  <div class="hint">ARROWS = select tile &nbsp;|&nbsp; OK = change channel &nbsp;|&nbsp; BACK = close</div>

<script>
  var CHANNELS = [
    { n: "Geo News",      v: "t3fvgmDDmdc" },
    { n: "92 News HD",    v: "PfO2i8XReZA" },
    { n: "Dunya News",    v: "e2XVSUYh4S0" },
    { n: "ARY News",      v: "5FW9ZVMR_7M" },
    { n: "SAMAA TV",      v: "MLDQM0QL_-4" },
    { n: "Express News",  v: "KNvaWHgOBMw" },
    { n: "City 42",       v: "-qyxyWe6zwM" },
    { n: "Al Jazeera Eng",v: "gCNeDWCI0vo" },
    { n: "Madina Live",   v: "rHWSRMcGGBQ" }
  ];
  var cells = document.querySelectorAll(".cell");
  var sel = 0, pickerOpen = false, pickerActive = 0;
  var choices = [];

  function embed(v) {
    return "https://www.youtube.com/embed/" + v + "?autoplay=1&mute=1&controls=1&rel=0";
  }
  function render() {
    cells.forEach(function (c, i) {
      c.classList.toggle("selected", i === sel);
    });
  }
  function currentChannel(i) {
    return cells[i].querySelector("iframe").src.match(/embed\/([A-Za-z0-9_-]{11})/)[1];
  }
  function openPicker(i) {
    sel = i;
    pickerOpen = true;
    var cur = currentChannel(i);
    choices = CHANNELS.map(function (ch, k) {
      return { k: k, ch: ch, on: ch.v === cur };
    });
    pickerActive = 0;
    var curIdx = choices.filter(function (o) { return o.on; }).map(function (o) { return o.k; })[0];
    if (curIdx !== undefined) pickerActive = curIdx;
    document.getElementById("picker-title").textContent = "Channel " + (i + 1) + " — choose";
    var box = document.getElementById("opts");
    box.innerHTML = "";
    choices.forEach(function (o) {
      var d = document.createElement("div");
      d.className = "opt" + (o.on ? " cur" : "");
      d.textContent = o.ch.n;
      d.onmouseenter = function () { pickerActive = o.k; renderOpts(); };
      d.onclick = function () { applyPick(o.k); };
      box.appendChild(d);
    });
    document.getElementById("overlay").classList.add("open");
    renderOpts();
  }
  function renderOpts() {
    document.querySelectorAll("#opts .opt").forEach(function (n, idx) {
      n.classList.toggle("active", idx === pickerActive);
    });
  }
  function applyPick(k) {
    var ch = CHANNELS[k].v;
    var cell = cells[sel];
    cell.querySelector("iframe").src = embed(ch);
    cell.querySelector(".label").textContent = CHANNELS[k].n;
    closePicker();
  }
  function closePicker() { document.getElementById("overlay").classList.remove("open"); pickerOpen = false; }

  function keySel(dir) {
    var r = Math.floor(sel / 2), c = sel % 2;
    if (dir === "up")    r = (r + 3) % 2;
    if (dir === "down")  r = (r + 1) % 2;
    if (dir === "left")  c = (c + 1) % 2;
    if (dir === "right") c = (c + 1) % 2;
    sel = r * 2 + c;
    render();
  }

  document.addEventListener("keydown", function (e) {
    var k = e.key;
    if (pickerOpen) {
      e.preventDefault();
      if (k === "ArrowUp" || k === "ArrowLeft") { pickerActive = (pickerActive + CHANNELS.length - 1) % CHANNELS.length; renderOpts(); }
      else if (k === "ArrowDown" || k === "ArrowRight") { pickerActive = (pickerActive + 1) % CHANNELS.length; renderOpts(); }
      else if (k === "Enter") applyPick(pickerActive);
      else if (k === "Escape" || k === "Backspace") closePicker();
      return;
    }
    if (k === "ArrowUp") { e.preventDefault(); keySel("up"); }
    else if (k === "ArrowDown") { e.preventDefault(); keySel("down"); }
    else if (k === "ArrowLeft") { e.preventDefault(); keySel("left"); }
    else if (k === "ArrowRight") { e.preventDefault(); keySel("right"); }
    else if (k === "Enter") { e.preventDefault(); openPicker(sel); }
    else if (k === "Backspace") { e.preventDefault(); location.reload(); }
  });

  cells.forEach(function (c, i) { c.onclick = function () { sel = i; render(); openPicker(i); }; });
  render();
</script>
</body>
</html>
